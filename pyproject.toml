[project]
name = "mcps"
version = "0.1.0"
description = "Self-host any MCP server in a Podman pod on your tailnet"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=15.0.0"]

[project.optional-dependencies]
dev = ["ruff==0.16.6", "mypy==2.3.1", "pytest==9.1.1"]

[project.scripts]
mcps = "mcps.development:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcps"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Types/signatures: ANN. Imports: I, TID252. Modern explicit types: UP.
# Specific errors and safe defaults: BLE, B. Basic correctness: E4/E7/E9/F.
select = ["E4", "E7", "E9", "F", "I", "ANN", "UP", "B", "BLE", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
# Enforce new modules and their tests. Legacy modules still have typing debt;
# silent follows their interfaces without hiding errors in the listed files.
follow_imports = "silent"
files = ["src/mcps/development.py", "src/mcps/tunnels.py", "tests/test_development.py", "tests/test_tunnels.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
